# UCM for Xiaomi Mi 8 (dipper)
#
# Speaker: TAS2557 smart amp driven from QUAT_MI2S_RX; playback frontend is
#   MultiMedia3 (hw:0,2).  MultiMedia1 is deliberately avoided: its q6afe
#   frontend needs a re-init dance on this ADSP (same reason alsa-ucm-conf
#   ships HiFi-MM1.conf as an MM3 variant for DB845c-class boards).
# Mic: AMIC3 -> ADC3 -> DEC0 -> AIF1_CAP -> SLIMBUS_0_TX -> MultiMedia2 (hw:0,1).
#
# The built-in mic on dipper sits on AMIC3 and is biased from MIC BIAS1, not
#   MIC BIAS3 (verified on-device: a 1 kHz tone played on the loudspeaker moves
#   the 1 kHz bin at ADC3 by ~285x, while AMIC1/AMIC2/AMIC5 show no response at
#   all).  The upstream DTS inherited beryllium's "AMIC3" -> "MIC BIAS3" pair,
#   which leaves the capsule unpowered: with only that pair the capture was
#   ~35 dB down and buried in noise.  The kernel DTS must therefore route
#   "AMIC3" -> "MIC BIAS1" (same fix as vendor dipper-audio-overlay.dtsi).
#   Do NOT copy the polaris (Mi MIX 2S) routing that uses AMIC1 -- silent here.
#
# Gain: 'ADC3 Volume' is the analog PGA, 1 dB/step, 0..20 = 0..+20 dB (the
#   driver's TLV advertises 0.25 dB/step, which is wrong).  'DEC0 Volume' is the
#   digital gain, 1 dB/step with 84 = 0 dB.  Now that the capsule is correctly
#   biased the old +20/+40 dB setting clips; +28 dB total (8 / 104) puts normal
#   speech at ~3-5 cm at -26 dBFS with healthy headroom.
# The controls must be written as 'ADC3 Volume' / 'DEC0 Volume'.  Writing them
#   as bare 'ADC3' / 'DEC0' fails with ENOENT inside a UCM sequence (verified
#   against this kernel), while amixer resolves the short name.

SectionVerb {
        EnableSequence [
                cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 1"
                cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
                cset "name='ADC MUX0' AMIC"
                cset "name='CDC_IF TX0 MUX' DEC0"
                cset "name='AIF1_CAP Mixer SLIM TX0' 1"
                cset "name='AMIC MUX0' ADC3"
                cset "name='ADC3 Volume' 8"
                cset "name='DEC0 Volume' 104"
        ]

        DisableSequence [
                cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 0"
                cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
        ]

        Value {
                TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Loud speaker"

        Value {
                PlaybackPriority 100
                PlaybackPCM "hw:${CardId},2"
        }
}

SectionDevice."Mic" {
        Comment "Built-in microphone"

        Value {
                CapturePriority 100
                CapturePCM "hw:${CardId},1"
        }
}
